server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Weather is fetched from Open-Meteo and the location map uses Esri imagery.
    # Keep the policy restrictive while permitting only those live-data sources.
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://api.open-meteo.com; script-src 'self'; style-src 'self'; img-src 'self' data: https://server.arcgisonline.com https://tile.openstreetmap.org; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
